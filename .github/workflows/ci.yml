name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: ruff check .
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q -m "not backend"
      - run: python -m pytest -q
        working-directory: reference_impl
  backend:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Run backend fixtures when implemented
        shell: bash
        run: |
          set +e
          python -m pytest -q -m backend
          result=$?
          if [ "$result" -eq 5 ]; then
            echo '::warning::No backend fixtures collected. No backend capability established.'
            exit 0
          fi
          exit "$result"
